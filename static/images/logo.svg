<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.15"/>
  <!-- Brain shape simplified -->
  <circle cx="100" cy="100" r="60" fill="url(#grad1)"/>
  <!-- Neural connections -->
  <circle cx="100" cy="65" r="10" fill="white" opacity="0.9"/>
  <circle cx="130" cy="90" r="8" fill="white" opacity="0.7"/>
  <circle cx="125" cy="120" r="9" fill="white" opacity="0.8"/>
  <circle cx="100" cy="135" r="10" fill="white" opacity="0.9"/>
  <circle cx="75" cy="120" r="8" fill="white" opacity="0.7"/>
  <circle cx="70" cy="90" r="9" fill="white" opacity="0.8"/>
  <!-- Lines -->
  <line x1="100" y1="65" x2="130" y2="90" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="130" y1="90" x2="125" y2="120" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="125" y1="120" x2="100" y2="135" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="135" x2="75" y2="120" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="75" y1="120" x2="70" y2="90" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="70" y1="90" x2="100" y2="65" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="65" x2="125" y2="120" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <line x1="130" y1="90" x2="75" y2="120" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="90" x2="125" y2="120" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>
